# Local development dependencies (epic 001-01).
#
# Everything runs in containers: web, worker, postgres, object storage.
#
# Scope note: docs/implementation/prototype-scope.md sets deployment to
# "local + CI only for now", so this is the development environment rather
# than a deployment reference. It does follow HO §6.6's shape — containerised
# web and job workers against managed-style Postgres and object storage — so
# standing up a real environment later is a configuration change rather than
# a rewrite.
#
#   docker compose up            everything
#   docker compose run --rm web bin/rails console
#   docker compose exec web bin/test

name: healthos

services:
  postgres:
    # PostgreSQL 18 for native uuidv7(). ADR-002 Decision 3b wants time-ordered
    # primary keys; 18 provides them in-database, so raw SQL insert paths
    # (imports, backfills) get them too rather than only ActiveRecord paths.
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${HEALTHOS_DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory, so the
      # mount goes at /var/lib/postgresql rather than the pre-18
      # /var/lib/postgresql/data. Mounting the old path fails at startup.
      - postgres_data:/var/lib/postgresql
      # Creates the three roles from ADR-002 Decision 4a. Runs only on first
      # initialisation of an empty data volume; bin/setup applies it
      # idempotently thereafter.
      - ./db/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # Object storage for raw source payloads (HO §6.5).
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: healthos
      MINIO_ROOT_PASSWORD: healthos_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the raw-payload bucket with OBJECT LOCKING ENABLED.
  #
  # ADR-002 Decision 4b: object lock is what makes raw source truth genuinely
  # append-only (INV-1), and it can only be enabled at bucket creation — it
  # cannot be turned on later. Getting it right in development is the whole
  # point of exercising it here rather than assuming it in production.
  minio_setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 healthos healthos_dev_password &&
      mc mb --with-lock --ignore-existing local/healthos-raw-payloads &&
      mc mb --ignore-existing local/healthos-exports &&
      echo 'buckets ready (healthos-raw-payloads has object locking enabled)'
      "

  # ---- Application ----------------------------------------------------
  #
  # Both app services share one image and one gem volume. The source is bind
  # mounted, so an edit on the host is live in the container without a
  # rebuild — the whole point of a separate dev image.

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bin/rails server -b 0.0.0.0 -p 3000
    ports:
      - "${HEALTHOS_WEB_PORT:-3000}:3000"
    volumes:
      - .:/rails
      # Named volumes over the bind mount, so host and container do not fight
      # over gems built for different architectures, and so tmp/log churn
      # stays out of the working tree.
      - bundle_cache:/usr/local/bundle
      - rails_tmp:/rails/tmp
      - rails_log:/rails/log
    environment: &app_env
      RAILS_ENV: development
      # Service names, not localhost: inside the network these resolve to the
      # other containers.
      HEALTHOS_DB_HOST: postgres
      HEALTHOS_DB_PORT: 5432
      HEALTHOS_DB_USER: healthos_app
      HEALTHOS_DB_PASSWORD: healthos_dev_password
      HEALTHOS_S3_ENDPOINT: http://minio:9000
      HEALTHOS_S3_ACCESS_KEY: healthos
      HEALTHOS_S3_SECRET_KEY: healthos_dev_password
      HEALTHOS_RAW_BUCKET: healthos-raw-payloads
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stdin_open: true
    tty: true

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Solid Queue. Without a worker the outbox dispatcher never runs, so
    # every cross-step side effect (S2C-021) would silently never happen —
    # a web-only environment looks fine and quietly does nothing.
    command: bin/jobs
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - rails_tmp:/rails/tmp
      - rails_log:/rails/log
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Runs once and exits. Migrations need the migrator role, which the app
  # role deliberately is not (ADR-002 4a) — so this cannot be folded into
  # web's startup without handing the app CREATE privileges.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      sh -c "bin/rails db:prepare && bin/rails db:privileges:apply"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - rails_tmp:/rails/tmp
      - rails_log:/rails/log
    environment:
      <<: *app_env
      HEALTHOS_DB_USER: healthos_migrator
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  bundle_cache:
  rails_tmp:
  rails_log:
