name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Must match the development server version: ADR-002 Decision 3b
        # depends on native uuidv7(), which arrived in PostgreSQL 18.
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=20

    env:
      RAILS_ENV: test
      HEALTHOS_DB_HOST: localhost
      HEALTHOS_DB_PORT: 5432
      HEALTHOS_DB_PASSWORD: healthos_dev_password

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # `schema_format = :sql` means Rails shells out to pg_dump, and pg_dump
      # refuses to run against a newer server. The runner image ships an older
      # client, so install the matching major version from PGDG rather than
      # relying on whatever happens to be preinstalled.
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          # The runner image already ships postgresql-client-16, which stays
          # ahead of the new package on PATH. Installing 18 is not enough —
          # its bin directory has to come first, or pg_dump silently stays on
          # 16 and renders CHECK constraints differently from the developer
          # machine, producing phantom schema drift.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Verify pg_dump major version matches the server
        run: |
          pg_dump --version
          pg_dump --version | grep -qE '\(PostgreSQL\) 18\.' \
            || { echo "::error::pg_dump is not version 18; structure.sql would drift"; exit 1; }

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The three roles from ADR-002 Decision 4a. Cluster-level objects, so
      # they cannot come from a migration.
      - name: Create database roles
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/roles.sql

      - name: Prepare database
        env:
          HEALTHOS_DB_USER: healthos_migrator
        run: bin/rails db:prepare

      # HO §124 "schema consistency". With structure.sql this means: migrating
      # must not leave the checked-in dump stale.
      - name: Check schema is up to date
        env:
          HEALTHOS_DB_USER: healthos_migrator
        run: |
          bin/rails db:migrate
          git diff --exit-code db/structure.sql

      # HO §125. Fails if a versioned definition's content changed while its
      # key and version stayed the same — which would silently reinterpret
      # every artifact already computed under it (INV-6..12).
      - name: Verify definition digests
        env:
          HEALTHOS_DB_USER: healthos_migrator
        run: bin/definitions verify

      # Runs as healthos_app (the database.yml default), so append-only
      # enforcement is exercised by every example — ADR-002 Decision 4a-iv.
      # spec/database/privileges_spec.rb is the HO §124 privileges check.
      - name: Run tests
        run: bin/rspec

      # HO §120 asks for the correlation concurrency test to run repeatedly,
      # because a lock bug is intermittent by nature — a single green run
      # proves very little. The savepoint bug this spec found passed a
      # sequential suite perfectly.
      - name: Concurrency loop (HO §120)
        env:
          CORRELATION_LOOP_RUNS: 20
        run: |
          bin/rspec spec/cases/correlation_concurrency_spec.rb \
                    spec/cases/resolution_signal_race_spec.rb \
                    spec/cases/watch_evaluation_spec.rb

  # Does the thing actually start?
  #
  # Added after Solid Queue was pointed at the wrong database and `bin/dev`
  # died on its first request while CI was green. Every other job here — lint,
  # two security scans, digest verification, 500 specs, a production image
  # build — was structurally incapable of catching that, because not one of
  # them booted the application. A green pipeline over an app that will not
  # start is worse than a red one.
  #
  # Deliberately asserts only what requires a running system. Everything
  # provable in a spec stays in a spec.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Boot the stack and exercise it
        run: bin/smoke --clean

  # The Dockerfile is not exercised by docker-compose in development (see the
  # epic 001-01 Decision Log), so build it here to stop it rotting.
  build_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build -t healthos:ci .

